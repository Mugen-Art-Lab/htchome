name: Build HTC Home v2

on:
  push:
    branches:
      - main
      - 'mugen/**'
    paths:
      - 'v2/**'
      - '.github/workflows/build-v2.yml'
  pull_request:
    paths:
      - 'v2/**'
      - '.github/workflows/build-v2.yml'

jobs:
  build-v2:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore packages
        run: nuget restore "v2/HTC Home.sln"

      - name: Build prototype projects
        shell: pwsh
        run: |
          $projects = @(
            'v2/HTCHome.Core/HTCHome.Core.csproj',
            'v2/HTC Home/HTC Home.csproj',
            'v2/Widgets/WeatherClockWidget/WeatherClockWidget.csproj',
            'v2/Extensions/Weather/MSN/MSN.csproj',
            'v2/HTCHome.Manager/HTCHome.Manager.csproj'
          )

          foreach ($project in $projects) {
            Write-Host "Building $project"
            msbuild $project /m /p:Configuration=Release /p:Platform=AnyCPU /fl /flp:"logfile=build-v2.log;verbosity=diagnostic;append"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: htchome-v2-build-log
          path: build-v2.log
          if-no-files-found: warn

      - name: Upload test build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: htchome-v2-mugen
          path: v2/bin/Release/**
          if-no-files-found: error
