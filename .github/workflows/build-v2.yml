name: Build HTC Home v2

on:
  push:
    branches:
      - main
      - 'mugen/**'
    paths:
      - 'v2/**'
      - '.github/workflows/build-v2.yml'
  pull_request:
    paths:
      - 'v2/**'
      - '.github/workflows/build-v2.yml'

jobs:
  build-v2:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore packages
        run: nuget restore "v2/HTC Home.sln"

      - name: Build Release
        shell: pwsh
        run: |
          msbuild "v2/HTC Home.sln" /m /p:Configuration=Release /p:Platform="Any CPU" /fl /flp:"logfile=build-v2.log;verbosity=diagnostic"
          exit $LASTEXITCODE

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: htchome-v2-build-log
          path: build-v2.log
          if-no-files-found: warn

      - name: Upload test build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: htchome-v2-mugen
          path: v2/bin/Release/**
          if-no-files-found: error
