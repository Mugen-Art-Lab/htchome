name: Build HTC Home v2

on:
  push:
    branches:
      - main
      - 'mugen/**'
    paths:
      - 'v2/**'
      - '.github/workflows/build-v2.yml'
  pull_request:
    paths:
      - 'v2/**'
      - '.github/workflows/build-v2.yml'

jobs:
  build-v2:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore packages
        run: nuget restore "v2/HTC Home.sln"

      - name: Build Release
        run: msbuild "v2/HTC Home.sln" /m /p:Configuration=Release /p:Platform="Any CPU"
